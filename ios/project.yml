name: VergiPro
options:
  bundleIdPrefix: com.vergipro
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Z37S5GS9SS
    CODE_SIGN_STYLE: Automatic
targets:
  VergiPro:
    type: application
    platform: iOS
    sources:
      - path: VergiPro
    info:
      path: VergiPro/Resources/Info.plist
      properties:
        CFBundleDisplayName: VergiPro
        NSCameraUsageDescription: Belgelerinizi güvenli biçimde taramak için kamera erişimi gereklidir.
        NSPhotoLibraryUsageDescription: Mevcut fiş ve faturaları seçebilmeniz için fotoğraf arşivi erişimi gereklidir.
        UIApplicationSupportsIndirectInputEvents: YES
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.vergipro.mobile.background-upload]
        UILaunchScreen:
          UILaunchScreen:
            UIImageName: VPMark
            UIImageRespectsSafeAreaInsets: false
            UIBackgroundColor: VPLaunchBackground
        VP_API_BASE_URL: "https://api.vergi.pro"
        VP_ENVIRONMENT: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vergipro.mobile
        PRODUCT_NAME: VergiPro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VergiPro/Resources/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets: []
